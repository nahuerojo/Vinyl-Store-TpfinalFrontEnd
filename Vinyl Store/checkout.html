<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finalizar Compra</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main style="max-width: 500px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h2>Datos de pago</h2>
    <form id="checkout-form">
  <label>Nombre completo</label>
  <input type="text" id="name" required />

  <label>Número de tarjeta</label>
  <input type="text" id="card" maxlength="16" required />

  <label>Vencimiento</label>
  <input type="text" id="expiry" placeholder="MM/AA" required />

  <label>Código de seguridad (CVV)</label>
  <input type="text" id="cvv" maxlength="3" required />

  <label>Email</label>
  <input type="email" id="email" required />

  <button type="submit" class="btn-finalizar">Pagar ahora</button>
</form>

  </main>


    <script>
document.getElementById("checkout-form").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const card = document.getElementById("card").value.trim();
  const expiry = document.getElementById("expiry").value.trim();
  const cvv = document.getElementById("cvv").value.trim();
  const email = document.getElementById("email").value.trim();

  // Validación simple
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const cardRegex = /^\d{16}$/;
  const cvvRegex = /^\d{3}$/;
  const expiryRegex = /^(0[1-9]|1[0-2])\/\d{2}$/;

  if (!name || !card || !expiry || !cvv || !email) {
    alert("Por favor completá todos los campos.");
    return;
  }

  if (!cardRegex.test(card)) {
    alert("El número de tarjeta debe tener 16 dígitos.");
    return;
  }

  if (!cvvRegex.test(cvv)) {
    alert("El CVV debe tener 3 dígitos.");
    return;
  }

  if (!expiryRegex.test(expiry)) {
    alert("Fecha de vencimiento inválida. Usá el formato MM/AA.");
    return;
  }

  if (!emailRegex.test(email)) {
    alert("Email inválido.");
    return;
  }

  // Si pasa todas las validaciones
  alert("¡Compra realizada con éxito!");
  localStorage.removeItem("cart");
  window.location.href = "index.html";
});
</script>
</body>
</html>
